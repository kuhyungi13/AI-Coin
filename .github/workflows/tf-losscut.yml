# TRAINER 로스컷 감시: 보유 코인의 1분봉 저가가 로스컷(증거금 -10%)에 닿으면 회의를 기다리지 않고 모의 청산한다.
# GitHub Actions의 최소 간격은 5분이고, 부하가 몰리면 몇 분 늦게 시작될 수 있다. 실제 주문 없음.
name: 코인 분석 TF팀 로스컷 감시

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tf-trainer-state   # 매시 자료 수집과 같은 파일(state.json)을 건드리므로 동시에 돌지 않게 한다
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 보유 코인이 있나
        id: held
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('paper/tf/trainer/state.json'))['positions'] else 1)" 2>/dev/null; then
            echo "held=yes" >> "$GITHUB_OUTPUT"
          else
            echo "held=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.held.outputs.held == 'yes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tf.txt
      - name: 로스컷 감시
        if: steps.held.outputs.held == 'yes'
        run: |
          pip install -q -r requirements-tf.txt
          python run_tf_losscut.py
      - name: 결과 저장
        if: steps.held.outputs.held == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add paper/tf/trainer
          git diff --cached --quiet && exit 0
          git commit -m "TRAINER 로스컷 감시 $(TZ=Asia/Seoul date +'%F %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
