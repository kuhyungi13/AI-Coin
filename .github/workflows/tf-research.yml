# 코인 분석 TF팀 전략 백테스트: 매주 일요일 한국 시각 03:00에 바이낸스 전체 USDT 코인의 과거 일봉으로 전략별 성과를 비교한다.
# 결과(paper/tf/research/BACKTEST.md)는 회의에서 ACE가 읽고 판단 근거로 쓴다. API 키·비용 없음. 실제 주문 없음.
name: 코인 분석 TF팀 백테스트 연구

on:
  schedule:
    - cron: "0 18 * * 6"   # 토요일 18:00 UTC = 일요일 03:00 KST
  workflow_dispatch:
    inputs:
      top:
        description: "거래대금 상위 N개만 (0이면 전체)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: tf-research

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-tf.txt pytest
      - name: 테스트
        run: python -m pytest -q tests/test_tf_team.py
      - name: 백테스트
        run: python run_tf_research.py --top ${{ github.event.inputs.top || '0' }}
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add paper/tf/research
          git diff --cached --quiet && exit 0
          git commit -m "TF팀 백테스트 결과 $(TZ=Asia/Seoul date +'%F %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
