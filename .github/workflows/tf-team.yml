# 코인 분석 TF팀: 매일 회의 자료(paper/tf/BRIEF.md)를 무료 공개 API로 모아 저장한다.
# 회의와 보고서(paper/TF_REPORT.md)는 Claude 프로젝트 안의 Claude가 이 자료로 진행한다. API 키·비용 없음.
name: 코인 분석 TF팀 자료 수집

on:
  schedule:
    - cron: "20 0 * * *"   # 매일 UTC 0시 20분 = 한국 오전 9시 20분 (일봉 마감 직후)
  workflow_dispatch:        # Actions 탭에서 "Run workflow"로 바로 실행
    inputs:
      coins:
        description: "분석할 코인 (띄어쓰기로 구분)"
        default: "BTC ETH"
  pull_request:             # 코드가 바뀌면 테스트와 자료 수집만 시험 (저장 안 함)
    paths:
      - "aicoin/tf_team/**"
      - "run_tf_team.py"
      - "tests/test_tf_team.py"
      - ".github/workflows/tf-team.yml"

permissions:
  contents: write

concurrency:
  group: tf-team-${{ github.ref }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-tf.txt pytest

      - name: 테스트
        run: python -m pytest -q tests/test_tf_team.py

      - name: 자료 수집
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}   # 없어도 됨 (있으면 요청 한도가 넉넉해짐)
          COINS: ${{ github.event.inputs.coins || 'BTC ETH' }}
        run: python run_tf_team.py $COINS

      - name: 회의 자료 저장
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add paper/tf/BRIEF.md
          git diff --cached --quiet && exit 0
          git commit -m "TF팀 회의 자료 $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
