# 코인 분석 TF팀: 매시간(하루 24번) 지난 의견 채점 + 바이낸스 전체 코인 스캔 + 회의 자료(paper/tf/BRIEF.md) 수집.
# 회의와 보고서(paper/TF_REPORT.md)는 Claude 프로젝트 안의 Claude가 매 수집 30분 뒤 이 자료로 진행한다. API 키·비용 없음.
name: 코인 분석 TF팀 자료 수집

on:
  schedule:
    # 매시간 20분 (하루 24번). 한 번에 1~2분이라 비공개 저장소 무료 한도(월 2,000분) 안에 든다
    - cron: "20 * * * *"
  workflow_dispatch:        # Actions 탭에서 "Run workflow"로 바로 실행
    inputs:
      coins:
        description: "회의할 코인 (비우면 BTC·ETH + 전체 스캔 후보)"
        default: ""
  pull_request:             # 코드가 바뀌면 테스트와 자료 수집만 시험 (저장 안 함)
    paths:
      - "aicoin/tf_team/**"
      - "run_tf_team.py"
      - "tests/test_tf_team.py"
      - ".github/workflows/tf-team.yml"

permissions:
  contents: write

concurrency:
  group: tf-team-${{ github.ref }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-tf.txt pytest

      - name: 테스트
        run: python -m pytest -q tests/test_tf_team.py

      - name: 자료 수집
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}   # 없어도 됨 (있으면 요청 한도가 넉넉해짐)
          COINS: ${{ github.event.inputs.coins || '' }}
        run: python run_tf_team.py $COINS

      - name: 회의 자료 저장
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add paper/tf/BRIEF.md paper/tf/SCAN.md paper/tf/SCOREBOARD.md paper/tf/scoreboard.json paper/tf/brief_meta.json
          git add paper/tf/verdicts.csv paper/tf/trainer 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "TF팀 회의 자료 $(TZ=Asia/Seoul date +'%F %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
