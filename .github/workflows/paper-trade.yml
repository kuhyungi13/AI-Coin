name: 모의 투자 (매일)

on:
  schedule:
    - cron: "10 0 * * *"   # 매일 UTC 00:10 = 한국 시간 오전 9시 10분 (일봉이 끝난 직후)
  workflow_dispatch:        # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_paper.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add paper/
          git diff --cached --quiet || git commit -m "모의 투자 기록 갱신 $(date -u +%F)"
          git push
