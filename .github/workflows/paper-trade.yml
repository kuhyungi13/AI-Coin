# 모의 투자를 매일 자동으로 돌리고 결과(paper/)를 저장소에 저장한다.
name: 모의 투자 (자동)

on:
  schedule:
    - cron: "10 */4 * * *"   # 4시간마다(UTC 0,4,8,...시 10분 = 한국 9,13,17,21,1,5시 10분). 4시간봉이 끝난 직후
  workflow_dispatch:        # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_paper.py
      - run: python run_screen.py   # 오늘의 코인 순위표 (paper/PICKS.md, 참고용)
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add paper/
          git diff --cached --quiet || git commit -m "모의 투자 기록 갱신 $(date -u +%F)"
          git push
